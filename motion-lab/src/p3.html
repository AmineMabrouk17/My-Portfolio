<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>03 — Two Voices</title>
<link rel="stylesheet" href="./lab.css" />
<style>
  .wrap { position: absolute; left: 96px; right: 96px; top: 128px; z-index: 3; }

  .rail { display: flex; align-items: center; gap: 13px; color: var(--muted2); }
  .rail .num { color: var(--ember); font-size: 12px; }
  .rail .bar { width: 0; height: 1px; background: var(--line2); transform-origin: 0 50%; }

  .head {
    margin-top: 26px;
    font-size: 96px;
    font-weight: 600;
    line-height: 1.03;
    letter-spacing: -0.038em;
    color: var(--text);
  }
  .head .line { display: block; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.09em; }
  .head .line > span { display: inline-block; will-change: transform; }
  .head .dim { color: #a89e97; }
  .head .punct {
    display: inline-block;
    width: 0.16em; height: 0.16em;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 24px 4px rgba(255, 107, 71, 0.5);
    vertical-align: 0.02em;
    margin-left: 0.04em;
  }

  .ruler { position: relative; height: 1px; margin-top: 46px; background: rgba(243,236,230,.16); transform-origin: 0 50%; }
  .tick { position: absolute; top: 0; width: 1px; height: 7px; background: rgba(243,236,230,.2); opacity: 0; }
  .tick.major { height: 12px; background: rgba(243, 236, 230, 0.34); }
  .travel {
    position: absolute; top: -1px; left: 0; height: 3px; width: 180px;
    background: linear-gradient(90deg, rgba(255, 107, 71, 0) 0%, #ff6b47 48%, #ffa552 100%);
    opacity: 0;
  }
  .ruler .count {
    position: absolute; right: 0; top: -34px;
    color: var(--muted2);
    display: flex; align-items: center; gap: 8px;
    white-space: nowrap;
  }
  .ruler .count b { color: var(--text); font-weight: 500; }

  .sub {
    margin-top: 30px;
    max-width: 56ch;
    font-size: 17px;
    line-height: 1.62;
    color: var(--muted);
  }
  .sub b { color: var(--text); font-weight: 500; }

  .ring {
    position: absolute;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--ember);
    left: 0; top: 0;
    opacity: 0;
    pointer-events: none;
  }

  .cast {
    position: absolute; left: 96px; right: 96px; bottom: 62px;
    border-top: 1px solid rgba(243,236,230,.1);
    padding-top: 16px;
    display: flex; justify-content: space-between;
    color: #6a615b; font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase;
  }
  .cast .c { position: relative; white-space: nowrap; }
  .cast .c::before {
    content: ""; position: absolute; left: 0; top: -17px; height: 1px; width: var(--w, 0px);
    background: var(--ember);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid" style="--gx:24%; --gy:34%"></div>
  <div class="glow" style="opacity:.5; transform: translate(-22%, 6%)"></div>

  <div class="wrap">
    <div class="rail mono" id="rail">
      <span class="num">04</span><span class="bar" id="railbar"></span><span>Projects</span>
    </div>

    <h2 class="head" id="head">
      <span class="line"><span id="l1">Things I'm</span></span>
      <span class="line"><span id="l2">building</span><span class="punct" id="dot"></span></span>
    </h2>

    <div class="ruler" id="ruler">
      <div class="travel" id="travel"></div>
      <div class="count mono" id="count"><b>06</b><span>shipped</span></div>
    </div>

    <p class="sub" id="sub">
      Six projects — web platforms and Telegram bots. Every card carries
      the <b>case study, the stack, and a live link.</b>
    </p>
  </div>

  <div class="cast mono" id="cast">
    <span class="c">Cast n Cue</span>
    <span class="c">GameStore TN</span>
    <span class="c">BudgetIQ</span>
    <span class="c">RakT3adiBot</span>
    <span class="c">SaletBot</span>
    <span class="c">Crypto &amp; Stocks</span>
  </div>

  <div class="ring" id="ring"></div>
  <div class="vignette"></div>
</div>

<script src="./lib.js"></script>
<script>
window.DURATION = 6200;

const addTicks = () => {
  const ruler = L.q('#ruler');
  const w = 1088;
  let html = '';
  for (let x = 0; x <= w; x += 60) {
    html += `<i class="tick${x % 240 === 0 ? ' major' : ''}" style="left:${x}px"></i>`;
  }
  ruler.insertAdjacentHTML('beforeend', html);
};
addTicks();

const head = L.q('#head');
const l1 = L.q('#l1'), l2 = L.q('#l2'), dot = L.q('#dot');
const rail = L.q('#rail'), railbar = L.q('#railbar');
const ruler = L.q('#ruler'), travel = L.q('#travel'), count = L.q('#count');
const sub = L.q('#sub');
const ticks = L.qa('.tick');
const ring = L.q('#ring');
const castItems = L.qa('#cast .c');

function render(t) {
  // rail
  const rp = L.easeOut(L.prog(t, 60, 520));
  L.set(rail, { opacity: rp.toFixed(3), transform: `translateY(${(1 - rp) * 8}px)` });
  L.set(railbar, { width: (L.easeOutExpo(L.prog(t, 220, 520)) * 34).toFixed(1) + 'px' });

  // headline: each line rises from behind its own mask; tracking settles as it lands
  [[l1, 240, 900], [l2, 380, 940]].forEach(([el, start, dur]) => {
    const p = L.easeOutExpo(L.prog(t, start, dur));
    L.set(el, {
      transform: `translateY(${(1 - p) * 112}%) rotate(${(1 - p) * 1.6}deg)`,
    });
  });
  head.style.letterSpacing =
    (-0.012 - 0.026 * L.easeOut(L.prog(t, 260, 1100))).toFixed(4) + 'em';

  // the full stop lights up
  const dp = L.easeOutExpo(L.prog(t, 1040, 520));
  L.set(dot, { transform: `scale(${dp.toFixed(3)})`, opacity: dp > 0 ? '1' : '0' });
  if (t > 1250 && t < 2400) {
    const q = L.prog(t, 1250, 1150);
    const r = 22 + L.easeOut(q) * 74;
    L.set(ring, {
      opacity: (Math.sin(q * Math.PI) * 0.5).toFixed(3),
      width: r.toFixed(1) + 'px',
      height: r.toFixed(1) + 'px',
      left: (dot.offsetLeft + 46 - r / 2 + 14).toFixed(1) + 'px',
      top: (head.offsetTop + head.offsetHeight - 78 - r / 2).toFixed(1) + 'px',
    });
  } else {
    L.set(ring, { opacity: '0' });
  }

  // the measuring rule draws, and its ticks follow the pen
  const ruleP = L.easeOutExpo(L.prog(t, 980, 820));
  L.set(ruler, { transform: `scaleX(${ruleP.toFixed(4)})` });
  const w = 1088;
  ticks.forEach((tk, i) => {
    const at = (i * 60) / w;
    const p = L.clamp((ruleP - at) / 0.08);
    L.set(tk, {
      opacity: p.toFixed(3),
      transform: `scaleY(${(0.2 + 0.8 * p).toFixed(3)})`,
    });
  });

  const cp = L.easeOut(L.prog(t, 1180, 600));
  L.set(count, { opacity: cp.toFixed(3), transform: `translateY(${(1 - cp) * 8}px)` });

  // the ember pass: one sweep along the bench
  const tp = L.prog(t, 1600, 1500);
  const x = L.easeInOut(tp) * (w + 260) - 180;
  L.set(travel, {
    opacity: (Math.sin(tp * Math.PI) * 0.95).toFixed(3),
    transform: `translateX(${x.toFixed(1)}px)`,
  });

  // the machine voice writes the index, left to right
  castItems.forEach((el, i) => {
    const land = 2450 + i * 250;
    const p = L.easeOut(L.prog(t, land, 480));
    el.style.color = `rgba(243,236,230,${(0.26 + p * 0.5).toFixed(2)})`;
    el.style.setProperty("--w", (p * 34).toFixed(1) + "px");
  });

  const sp = L.easeOut(L.prog(t, 1140, 720));
  L.set(sub, { opacity: sp.toFixed(3), transform: `translateY(${(1 - sp) * 14}px)` });
}
window.render = render;
</script>
</body>
</html>
